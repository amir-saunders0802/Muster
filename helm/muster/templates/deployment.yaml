apiVersion: apps/v1
kind: Deployment
metadata:
  name: muster-api
  labels:
    app: muster-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: muster-api
  template:
    metadata:
      labels:
        app: muster-api
    spec:
      containers:
        - name: muster-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: catalog
              mountPath: /app/config/services.yaml
              subPath: services.yaml
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: catalog
          configMap:
            name: muster-catalog
