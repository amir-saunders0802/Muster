apiVersion: apps/v1
kind: Deployment
metadata:
  name: muster-api
  labels:
    app: muster-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: muster-api
  template:
    metadata:
      labels:
        app: muster-api
    spec:
      containers:
        - name: muster-api
          image: muster:local
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: catalog
              mountPath: /app/config/services.yaml
              subPath: services.yaml
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          # Intentionally wrong on purpose: this route does not exist in the app,
          # so Kubernetes will restart the pod if the probe fails.
          livenessProbe:
            httpGet:
              path: /upstream-status
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: catalog
          configMap:
            name: muster-catalog
